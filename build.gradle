plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        // WSL2 box has ~7.7 GiB RAM total; cap heaps so the game coexists with Gradle.
        client {
            vmArg "-Xmx2G"
        }
        server {
            vmArg "-Xmx2G"
        }
    }
}

// Fabric GameTest wiring: a separate `gametest` source set + the `runGametest` task (headless
// server, -Dfabric-api.gametest, exits nonzero on failure) — the CLAUDE.md "headless logic gate".
// Tests register via the `fabric-gametest` entrypoint in src/gametest/resources/fabric.mod.json.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "map2mc-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Plain JUnit unit tests for pure logic (ordering strategies, pacing). These touch only the
    // simple BlockPos POJO — no registry/bootstrap — so they run without a live game.
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ── Auto-deploy the built mod jar into a local Minecraft mods/ folder ─────────────────────────────
// A WSL→Windows symlink isn't followed by the Windows Java launcher, so instead: set `map2mcModsDir`
// in ~/.gradle/gradle.properties (or the MAP2MC_MODS_DIR env var) to your mods folder, and every
// `./gradlew build` (or just `./gradlew deployMod`) copies the remapped jar there — no manual move.
// Unset (fresh clone / CI) → the task skips, so the build stays portable.
def map2mcModsDir = (project.findProperty('map2mcModsDir') ?: System.getenv('MAP2MC_MODS_DIR'))?.toString()

tasks.register('deployMod', Copy) {
    description = 'Copy the remapped mod jar into the local Minecraft mods/ folder (set map2mcModsDir).'
    group = 'fabric'
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar')   // the production (remapped) jar only — not -sources/-dev
    into map2mcModsDir ?: "${layout.buildDirectory.get().asFile}/deploy-skipped"
    onlyIf {
        boolean configured = map2mcModsDir != null && !map2mcModsDir.isEmpty()
        if (!configured) {
            logger.lifecycle('map2mc: deployMod skipped — set map2mcModsDir in ~/.gradle/gradle.properties to auto-install.')
        }
        configured
    }
    doLast { logger.lifecycle("map2mc: deployed mod jar -> ${map2mcModsDir}") }
}

tasks.named('build') { finalizedBy 'deployMod' }
